name: iOS package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-package
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  ios:
    name: Build unsigned iOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate the iOS runner
        run: flutter create --platforms=ios --org com.follow --project-name fl_clash .

      - name: Disable Go/Core build hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text()
          text = text.replace(
              '    setup:\n      build_assets: true',
              '    setup:\n      build_assets: false',
              1,
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf build/ios
          set +e
          flutter build ios --release --no-codesign
          flutter_status=$?
          set -e
          app_path="$(find build/ios -type d -path '*/Runner.app' -print -quit 2>/dev/null || true)"
          if test ! -d "$app_path"; then
            exit "$flutter_status"
          fi
          if test "$flutter_status" -ne 0; then
            echo 'Flutter reported an unsigned-device export warning after producing Runner.app; continuing.'
          fi

      - name: Verify unsigned iOS app
        run: |
          set -euo pipefail
          app_path="$(find build/ios -type d -path '*/Runner.app' -print -quit 2>/dev/null || true)"
          test -d "$app_path"
          rust_framework_binary="$(find build/native_assets/ios -type f -path '*/rust_api.framework/rust_api' -print -quit 2>/dev/null || true)"
          test -n "$rust_framework_binary"
          rust_framework_path="$(dirname "$rust_framework_binary")"
          destination="$app_path/Frameworks/rust_api.framework"
          test -f "$rust_framework_path/rust_api"
          mkdir -p "$app_path/Frameworks"
          rm -rf "$destination"
          mkdir -p "$destination"
          ditto "$rust_framework_path/." "$destination/"
          install -m 755 "$rust_framework_binary" "$destination/rust_api"
          find "$destination" -maxdepth 2 -print
          ls -l "$destination/rust_api"
          test -f "$destination/rust_api"

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          if-no-files-found: error
          path: build/ios/**/Runner.app
