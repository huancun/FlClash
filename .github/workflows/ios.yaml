name: iOS package

on:
  workflow_dispatch:

concurrency:
  group: ios-package
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  ios:
    name: Build unsigned iOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate the iOS runner
        run: flutter create --platforms=ios --org com.follow --project-name fl_clash .

      - name: Disable Go/Core build hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text()
          text = text.replace(
              '    setup:\n      build_assets: true',
              '    setup:\n      build_assets: false',
              1,
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS IPA
        run: |
          set -euo pipefail
          app_path="$(find build/ios -type d -path '*/Runner.app' -print -quit)"
          ipa_path='build/ios/ipa/FlClash-unsigned.ipa'
          test -d "$app_path"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$app_path" build/ios/ipa/Payload/Runner.app
          (
            cd build/ios/ipa
            zip -qry "$(basename "$ipa_path")" Payload
          )

      - name: Verify Rust framework is embedded
        run: |
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          unzip -l "$ipa_path" | grep -Fq 'Payload/Runner.app/Frameworks/rust_api.framework/rust_api'

      - name: Upload unsigned iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          if-no-files-found: error
          path: build/ios/ipa/*.ipa
